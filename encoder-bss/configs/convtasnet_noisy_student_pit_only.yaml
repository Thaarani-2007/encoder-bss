# Student control: 70/30 inputs, PIT only (no feature distillation).
project_name: bss-audio-acsim
run_name: convtasnet_noisy_student_pit_only

data:
  root: ${oc.env:BSS_DATA_ROOT,E:/bss-audio-data}
  sample_rate: 16000
  clip_seconds: 5.0
  source: cache
  cache_dir: ${oc.env:BSS_DATA_ROOT,E:/bss-audio-data}/cache/convtasnet_paired_200k
  input_mode: student_mix
  require_paired: true
  noisy_fraction: 0.70
  num_workers: 0

training:
  max_steps: 200000
  batch_size: 1
  grad_accum_steps: 16
  precision: bf16
  grad_clip: 5.0
  log_every: 50
  eval_every: 10000
  save_every: 10000
  seed: 42
  gpu_rest_enabled: false
  init_checkpoint: checkpoints/convtasnet_clean_teacher/best.pt
  init_masker_decoder_from_teacher: true
  collapse_gate_step: 50000
  collapse_gate_pct: 20.0
  collapse_eval_clips: 20
  early_stop:
    enabled: true
    patience: 3
    min_delta: 0.1
    stop_on_regression: true
    regression_delta: 0.5
    min_steps: 50000

optimizer:
  name: adamw
  lr: 5.0e-4
  betas: [0.9, 0.99]
  weight_decay: 0.01
  warmup_steps: 2000

scheduler:
  mode: rate_plateau
  patience: 2
  factor: 0.5
  rate_floor: 2.0e-7
  rate_ratio: 0.4
  min_lr: 1.0e-5

loss:
  mode: pit_sisnr
  lambda_collapse: 0.5
  lambda_mixcopy: 0.25

model:
  name: convtasnet_noisy
  n_src: 2
  encoder_dim: 512
  kernel_size: 16
  stride: 8
  bottleneck_dim: 128
  hidden_dim: 512
  n_blocks: 8
  n_repeats: 3
  mask_activation: sigmoid
  student_hidden_dim: 192
  student_encoder_blocks: 2

eval:
  root: ${oc.env:BSS_DATA_ROOT,E:/bss-audio-data}/eval/acsim_tierb
  max_clips_per_split: 50
  metric_profile: train

wandb:
  enabled: true
  offline: false
  project: bss-audio-acsim
  entity: null
  tags: [phase1b, convtasnet, noisy, student, pit_only, run7]

simulation:
  mode: acsim
  p_speaker2: 1.0
