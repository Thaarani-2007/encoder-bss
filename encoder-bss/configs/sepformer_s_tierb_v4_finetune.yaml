# Finetune from run1 @ 120k (D-All -8.64 dB) with SepReformer-style objective.
# Papers: Chen AC-SIM-ML (eval metric + plateau LR), SepReformer (clamped PIT SI-SNR,
# AdamW, grad clip 5). Warm-started weights; fresh optimizer at step 0.
project_name: bss-audio-acsim
run_name: sepformer_s_tierb_v4_finetune

data:
  root: ${oc.env:BSS_DATA_ROOT,D:/bss-audio-data}
  sample_rate: 16000
  clip_seconds: 4.0
  source: cache
  cache_dir: ${oc.env:BSS_DATA_ROOT,D:/bss-audio-data}/cache/train_acsim_200k
  num_workers: 0

training:
  max_steps: 80000
  batch_size: 1
  grad_accum_steps: 16
  precision: bf16
  grad_clip: 5.0
  log_every: 50
  eval_every: 10000
  save_every: 10000
  seed: 42
  gpu_rest_enabled: false
  init_checkpoint: checkpoints/sepformer_s_tierb/best.pt
  early_stop:
    enabled: true
    patience: 2
    min_delta: 0.3
    stop_on_regression: true
    regression_delta: 1.0
    min_steps: 20000

optimizer:
  name: adamw
  lr: 1.0e-4
  betas: [0.9, 0.99]
  weight_decay: 0.01
  warmup_steps: 1000

scheduler:
  mode: plateau
  patience: 3
  factor: 0.5

# SepReformer PIT SI-SNR (clamped τ=30) — loss aligns with D-All eval metric.
loss:
  mode: pit_sisnr

model:
  name: sepformer_s
  n_src: 2
  encoder_dim: 160
  n_heads: 8
  d_ffn: 768
  n_blocks: 6
  n_stages: 2
  kernel_size: 16
  stride: 8
  chunk_size: 250
  gradient_checkpointing: true

eval:
  root: ${oc.env:BSS_DATA_ROOT,D:/bss-audio-data}/eval/acsim_tierb
  max_clips_per_split: 50
  metric_profile: train

wandb:
  enabled: true
  project: bss-audio-acsim
  entity: null
  tags: [phase1b, sepformer-s, tierb, finetune-v1-120k, pit-sisnr, v4]
  audio:
    enabled: true
    split: D-All
    max_clips: 3
    clip_indices: [0, 1, 2]

simulation:
  mode: acsim
  p_speaker2: 0.5
  p_static_noise: 0.5
  p_event_noise: 0.3
  p_seg: 0.75
  l1: 0.2
  l2: 1.0
  p_event_overlap_removal: 0.5
