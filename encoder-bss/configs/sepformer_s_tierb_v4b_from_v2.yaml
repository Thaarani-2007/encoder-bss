# SepFormer v4b finetune from v2 @ 40k (only if ablation favors SepFormer).
# One WandB run — do not also run DPRNN-256 fallback in parallel.
project_name: bss-audio-acsim
run_name: sepformer_s_tierb_v4b_from_v2

data:
  root: ${oc.env:BSS_DATA_ROOT,D:/bss-audio-data}
  sample_rate: 16000
  clip_seconds: 4.0
  source: cache
  cache_dir: ${oc.env:BSS_DATA_ROOT,D:/bss-audio-data}/cache/train_acsim_200k
  num_workers: 0

training:
  max_steps: 80000
  batch_size: 1
  grad_accum_steps: 16
  precision: bf16
  grad_clip: 5.0
  log_every: 50
  eval_every: 10000
  save_every: 10000
  seed: 42
  gpu_rest_enabled: false
  init_checkpoint: checkpoints/sepformer_s_tierb_v2/best.pt
  early_stop:
    enabled: true
    patience: 2
    min_delta: 0.3
    stop_on_regression: true
    regression_delta: 1.0
    min_steps: 50000

optimizer:
  name: adamw
  lr: 1.0e-4
  betas: [0.9, 0.99]
  weight_decay: 0.01
  warmup_steps: 1000

scheduler:
  mode: rate_plateau
  patience: 2
  factor: 0.5
  rate_floor: 1.5e-7
  rate_ratio: 0.5
  min_lr: 1.0e-6

loss:
  mode: pit_sisnr_hybrid
  alpha: 0.2
  lambda_time: 2.0
  lambda_mstft: 3.0
  lambda_mel: 3.0
  mstft_fft_sizes: [512, 1024, 2048]
  mel_n_fft: 1024
  mel_n_mels: 128

model:
  name: sepformer_s
  n_src: 2
  encoder_dim: 160
  n_heads: 8
  d_ffn: 768
  n_blocks: 6
  n_stages: 2
  kernel_size: 16
  stride: 8
  chunk_size: 250
  gradient_checkpointing: true

eval:
  root: ${oc.env:BSS_DATA_ROOT,D:/bss-audio-data}/eval/acsim_tierb
  max_clips_per_split: 50
  metric_profile: train

wandb:
  enabled: true
  project: bss-audio-acsim
  entity: null
  tags: [phase1b, sepformer-s, tierb, v4b, hybrid-loss, from-v2-40k]
  audio:
    enabled: true
    split: D-All
    max_clips: 3
    clip_indices: [0, 1, 2]

simulation:
  mode: acsim
  p_speaker2: 0.5
  p_static_noise: 0.5
  p_event_noise: 0.3
  p_seg: 0.75
  l1: 0.2
  l2: 1.0
  p_event_overlap_removal: 0.5
