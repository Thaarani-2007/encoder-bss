# Smoke gate for clean teacher (500 steps).
project_name: bss-audio-acsim
run_name: convtasnet_clean_teacher_smoke

data:
  root: ${oc.env:BSS_DATA_ROOT,E:/bss-audio-data}
  sample_rate: 16000
  clip_seconds: 5.0
  source: cache
  cache_dir: ${oc.env:BSS_DATA_ROOT,E:/bss-audio-data}/cache/convtasnet_paired_200k
  input_mode: clean
  require_paired: true
  num_workers: 0

training:
  max_steps: 500
  batch_size: 1
  grad_accum_steps: 4
  precision: bf16
  grad_clip: 5.0
  log_every: 50
  eval_every: 500
  save_every: 500
  seed: 42
  gpu_rest_enabled: false

optimizer:
  name: adam
  lr: 1.0e-3
  betas: [0.9, 0.99]
  weight_decay: 0.0
  warmup_steps: 50

scheduler:
  mode: cosine

loss:
  mode: pit_sisnr
  lambda_collapse: 0.5
  lambda_mixcopy: 0.25

model:
  name: convtasnet_clean
  n_src: 2
  encoder_dim: 512
  kernel_size: 16
  stride: 8
  bottleneck_dim: 128
  hidden_dim: 512
  n_blocks: 8
  n_repeats: 3
  mask_activation: sigmoid

eval:
  root: ${oc.env:BSS_DATA_ROOT,E:/bss-audio-data}/eval/acsim_clean
  max_clips_per_split: 10
  metric_profile: train

wandb:
  enabled: true
  offline: false
  project: bss-audio-acsim
  tags: [phase1b, convtasnet, smoke, teacher]

simulation:
  mode: acsim
  p_speaker2: 1.0
