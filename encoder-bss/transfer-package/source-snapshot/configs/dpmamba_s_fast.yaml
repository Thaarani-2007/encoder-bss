project_name: bss-audio-acsim
run_name: dpmamba_s_acsim_ml_fast

data:
  root: ${oc.env:BSS_DATA_ROOT,D:/bss-audio-data}
  sample_rate: 16000
  clip_seconds: 4.0
  # source: onthefly | cache — use cache to avoid CPU/GPU oscillation
  source: cache
  num_workers: 0

training:
  max_steps: 80000
  batch_size: 1
  grad_accum_steps: 8
  precision: bf16
  grad_clip: 5.0
  log_every: 50
  eval_every: 10000
  save_every: 5000
  seed: 42
  gpu_rest_enabled: false

optimizer:
  lr: 1.5e-4
  betas: [0.9, 0.99]
  weight_decay: 0.0
  warmup_steps: 10000

loss:
  lambda_time: 100.0
  lambda_mstft: 10.0
  lambda_mel: 10.0
  lambda_sdr: 1.0
  mstft_fft_sizes: [512, 1024, 2048]
  mel_n_fft: 1024
  mel_n_mels: 128

model:
  name: dprnn_s
  n_src: 2
  encoder_dim: 128
  hidden_dim: 128
  chunk_size: 250
  n_layers: 6

eval:
  max_clips_per_split: 20
  # train = SI-SDRi + Silence-SDRi only (fast, in-loop); full = all 7 metrics (offline)
  metric_profile: train

wandb:
  enabled: true
  project: bss-audio-acsim
  entity: null
  tags: [fast-track, acsim-ml]

simulation:
  mode: acsim
  p_speaker2: 0.5
  p_static_noise: 0.5
  p_event_noise: 0.3
  p_seg: 0.75
  l1: 0.2
  l2: 1.0
