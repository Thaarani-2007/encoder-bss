# Run 5 — finetune from Run 4 best (+0.73 dB D-All, 0% collapse).
# Plan: research/phase1b/RUN5-PLAN.md
#
# Key changes vs Run 4 (v2):
#   - init: checkpoints/dprnn_m_tierb_v2/best.pt
#   - loss: pure pit_sisnr (no spectral aux)
#   - scheduler: rate_plateau (derivative on D-All gain rate)
#   - AdamW 5e-4 finetune
project_name: bss-audio-acsim
run_name: dprnn_m_tierb_v3_finetune

data:
  root: ${oc.env:BSS_DATA_ROOT,D:/bss-audio-data}
  sample_rate: 16000
  clip_seconds: 5.0
  source: cache
  cache_dir: ${oc.env:BSS_DATA_ROOT,D:/bss-audio-data}/cache/train_acsim_200k
  num_workers: 0

training:
  max_steps: 100000
  batch_size: 1
  grad_accum_steps: 16
  precision: bf16
  grad_clip: 5.0
  log_every: 50
  eval_every: 10000
  save_every: 10000
  seed: 42
  gpu_rest_enabled: false
  init_checkpoint: checkpoints/dprnn_m_tierb_v2/best.pt
  collapse_gate_step: 30000
  collapse_gate_pct: 30.0
  collapse_eval_clips: 20
  early_stop:
    enabled: true
    patience: 4
    min_delta: 0.1
    stop_on_regression: true
    regression_delta: 0.35
    min_steps: 40000

optimizer:
  name: adamw
  lr: 5.0e-4
  betas: [0.9, 0.99]
  weight_decay: 0.01
  warmup_steps: 1000

scheduler:
  mode: rate_plateau
  patience: 2
  factor: 0.5
  rate_floor: 2.0e-7
  rate_ratio: 0.4
  improve_ratio: 1.1
  regression_delta: 0.15  # count as slowing when D-All drops this far below best
  min_lr: 1.0e-5

loss:
  mode: pit_sisnr
  lambda_collapse: 0.5
  lambda_mixcopy: 0.25

model:
  name: dprnn_tasnet
  n_src: 2
  encoder_dim: 256
  bottleneck_dim: 128
  hidden_dim: 256
  kernel_size: 16
  stride: 8
  chunk_size: 250
  hop_size: 125
  n_layers: 6
  mask_activation: softmax

eval:
  root: ${oc.env:BSS_DATA_ROOT,D:/bss-audio-data}/eval/acsim_tierb
  max_clips_per_split: 50
  metric_profile: train

wandb:
  enabled: true
  project: bss-audio-acsim
  entity: null
  tags: [phase1b, dprnn-m, tierb, v3, finetune, pit-sisnr, rate-plateau]
  audio:
    enabled: true
    split: D-All
    max_clips: 3
    clip_indices: [0, 1, 2]

simulation:
  mode: acsim
  p_speaker2: 0.5
  p_static_noise: 0.5
  p_event_noise: 0.3
  p_seg: 0.75
  l1: 0.2
  l2: 1.0
  p_event_overlap_removal: 0.5
